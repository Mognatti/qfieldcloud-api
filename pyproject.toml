[project]
name = "qfieldcloud"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Caio Mognatti", email = "caiocsm97@gmail.com" }
]
dependencies = [
    "pytest>=9.0.2",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "httpx>=0.28.1",
    "dependency-injector>=4.48.3",
    "fastapi-utils>=0.8.0",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "colorlog>=6.10.1",
    "qfieldcloud-sdk>=0.12.0",
    "python-multipart>=0.0.22",
]
readme = "README.md"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/qfieldcloud"]
